<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f3f5f9; 
            padding: 40px 20px;
        }
        .wrap {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
        }
        /* 4列网格布局 */
        .grid-box {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }
        .grid-item {
            display:block;
            text-decoration: none;
            border: 1px solid #d6d9e2;
            border-radius: 8px;
            background: #fff;
            text-align: center;
            padding: 22px 10px;
            font-size: 24px;
            color: #384259;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        /* ==========悬浮变色重点代码========== */
        .grid-item:hover {
            border-color: #6388d8;
            background-color: #f0f5ff;  /* 悬浮浅蓝底色 */
            color: #2b5cb8;             /* 悬浮文字蓝色 */
            box-shadow: 0 4px 12px rgba(99, 136, 216, 0.15);
        }
        /* 移动端自动适配 */
        @media (max-width: 1024px) {
            .grid-box {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 560px) {
            .grid-box {
                grid-template-columns: repeat(1, 1fr);
            }
        }
    </style>
</head>
<body>
<div class="wrap">
